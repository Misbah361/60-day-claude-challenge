<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kia Seltos · E85 Fuel Dashboard</title>
<style>
:root{--bg:#0a0f1e;--tx:#e8ecf6;--mu:#8b95b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16244a,#0a0f1e 60%);color:var(--tx);font:14px system-ui,sans-serif;padding:16px;min-height:100vh}
.w{max-width:1440px;margin:auto}h1{font-size:clamp(16px,3vw,26px);margin:0 0 4px}.sub{color:var(--mu);margin-bottom:14px}
.g{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:16px;padding:16px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ctl label{color:var(--mu);font-size:12px}.ctl select,.ctl input{background:#111a33;color:var(--tx);border:1px solid #2a3760;border-radius:8px;padding:6px;width:110px}
.grid{display:grid;gap:14px;margin-bottom:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kv{font-size:24px;font-weight:700;margin:6px 0}.kl{color:var(--mu);font-size:12px}h3{margin:0 0 10px;font-size:15px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mu);font-size:11px}
#tip{position:fixed;pointer-events:none;background:#000c;color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;display:none;z-index:9}
.fc{border-top:4px solid var(--c);transition:.3s}.fc.on{box-shadow:0 0 24px var(--c);transform:translateY(-3px)}.fc h4{margin:0 0 8px;color:var(--c)}.fc p{margin:4px 0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px;text-align:right;border-bottom:1px solid #ffffff18}th:first-child,td:first-child{text-align:left}
.gauge-arc{animation:g 1.5s ease-out}@keyframes g{from{stroke-dashoffset:283}}
.verdict{text-align:center;margin-top:6px;font-weight:600}
</style></head><body><div class="w">
<h1 id="hd"></h1><div class="sub" id="sb"></div>
<div class="ctl g"><div><label>Reference fuel</label><br><select id="fu"></select></div><div><label>KM / month</label><br><input id="km" type="number" value="1000"></div><div><label>Car age (yrs)</label><br><input id="ag" type="number" value="3" min="0" max="12"></div></div>
<div class="grid k" id="kp"></div>
<div class="grid two"><div class="g"><h3>Cost per km (₹)</h3><svg id="bar" viewBox="0 0 400 240"></svg></div><div class="g"><h3>CO₂ per km (kg)</h3><svg id="dn" viewBox="0 0 400 240"></svg></div></div>
<div class="grid two"><div class="g"><h3>Cost per km vs vehicle age</h3><svg id="ln" viewBox="0 0 400 260"></svg></div><div class="g"><h3>E85 score</h3><svg id="ga" viewBox="0 0 200 130"></svg><div class="verdict" id="vd"></div></div></div>
<div class="grid two"><div class="g"><h3>Age buckets · Cost/km · Maint/km</h3><div id="bk"></div></div><div class="g"><h3>E85 paradox</h3><div id="pd"></div></div></div>
<div class="grid k" id="fc"></div></div><div id="tip"></div>
<script>
const R=[["CNG",7,1316,4600,167.3,904,8,80,22.9],["Diesel",4,2343,10201,399.9,1270,5,91,20.9],["CNG",2,1450,4464,181.5,730,8,80,26.0],["Electric (EV)",3,2457,4468,218.5,346,45,12,6.6],["CNG",3,970,3144,116.7,712,8,80,24.7],["CNG",3,1094,3544,136.3,823,8,80,24.7],["Petrol (E20)",4,1294,7570,213.8,702,5,100,17.1],["Diesel",4,1348,5870,230.1,958,5,91,20.9],["Electric (EV)",1,1142,1957,106.0,319,45,12,7.0],["Petrol (E20)",8,1673,10590,290.1,867,5,100,15.8],["Diesel",3,2448,10656,415.4,970,5,91,20.9],["E85 (Flex-Fuel)",1,1067,6732,77.9,646,5,82,13.0],["E85 (Flex-Fuel)",1,2749,17343,184.3,568,5,82,13.0],["E85 (Flex-Fuel)",1,1686,10635,112.5,573,5,82,13.0],["Electric (EV)",2,903,1548,85.2,253,45,12,7.0],["Electric (EV)",1,2774,4756,259.2,322,45,12,7.0],["CNG",6,1585,5536,201.4,1114,8,80,22.9],["Diesel",6,1502,7043,276.8,1323,5,91,19.4],["Electric (EV)",4,1115,2027,101.9,362,45,12,6.6],["Diesel",6,962,4514,181.4,1332,5,91,19.4],["E85 (Flex-Fuel)",2,925,5838,62.4,530,5,82,13.0],["Diesel",12,951,5032,172.3,1550,5,91,17.2],["CNG",4,1191,3856,150.2,841,8,80,24.7],["E85 (Flex-Fuel)",1,1586,10004,112.7,630,5,82,13.0],["Electric (EV)",2,1188,2036,103.8,297,45,12,7.0],["Petrol (E20)",8,1540,9750,266.5,702,5,100,15.8],["Petrol (E20)",7,3105,19650,519.1,727,5,100,15.8],["E85 (Flex-Fuel)",2,1614,10184,109.8,661,5,82,13.0],["CNG",3,1534,4968,190.9,764,8,80,24.7],["Petrol (E20)",5,1513,8850,260.1,684,5,100,17.1],["Petrol (E20)",7,3119,19740,560.6,698,5,100,15.8],["Petrol (E20)",3,959,5610,151.4,655,5,100,17.1],["Electric (EV)",1,1496,2564,128.5,272,45,12,7.0],["Diesel",9,1333,6252,231.7,1524,5,91,19.4],["E85 (Flex-Fuel)",1,1491,9405,106.1,663,5,82,13.0],["E85 (Flex-Fuel)",2,1633,10299,111.1,626,5,82,13.0],["CNG",8,2523,8816,308.1,1097,8,80,22.9],["Petrol (E20)",7,1116,7060,195.3,718,5,100,15.8],["Petrol (E20)",6,1598,10110,280.9,750,5,100,15.8],["E85 (Flex-Fuel)",1,1003,6330,72.6,542,5,82,13.0],["E85 (Flex-Fuel)",3,1504,10029,105.4,763,5,82,12.3],["Electric (EV)",4,1063,1933,102.2,397,45,12,6.6],["CNG",6,951,3320,126.4,939,8,80,22.9],["Electric (EV)",1,1371,2351,128.0,258,45,12,7.0],["CNG",5,1299,4208,159.9,792,8,80,24.7],["Electric (EV)",1,1579,2707,138.8,320,45,12,7.0],["Diesel",11,1452,7680,282.4,1728,5,91,17.2],["Electric (EV)",3,1654,3007,151.9,375,45,12,6.6],["E85 (Flex-Fuel)",3,1289,8594,93.9,837,5,82,12.3],["Petrol (E20)",7,2361,14940,419.4,731,5,100,15.8],["Petrol (E20)",5,1031,6030,164.2,614,5,100,17.1],["Diesel",4,972,4232,170.0,1131,5,91,20.9]];const H=["t","a","d","c","co","m","r","p","mi"];
const D=R.map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]])));
const N=t=>t.startsWith("Elec")?"EV":t.startsWith("Petrol")?"Petrol":t.startsWith("E85")?"E85":t;
const F=["E85","Petrol","Diesel","CNG","EV"].filter(f=>D.some(r=>N(r.t)==f));
const CL={E85:"#ffb020",Petrol:"#3b82f6",Diesel:"#9ca3af",CNG:"#22c55e",EV:"#a855f7"};
const av=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);const $=id=>document.getElementById(id);
const S={};F.forEach(f=>{const r=D.filter(x=>N(x.t)==f);S[f]={r,cost:av(r.map(x=>x.c/x.d)),co2:av(r.map(x=>x.co/x.d)),mnt:av(r.map(x=>x.m/x.d)),ref:av(r.map(x=>x.r)),price:av(r.map(x=>x.p)),mil:av(r.map(x=>x.mi))}});
const fx=(v,n=2)=>v.toFixed(n);const tip=$("tip");
function tp(e,t){e.onmousemove=ev=>{tip.style.display="block";tip.style.left=ev.clientX+12+"px";tip.style.top=ev.clientY+12+"px";tip.textContent=t};e.onmouseleave=()=>tip.style.display="none"}
const NS="http://www.w3.org/2000/svg";function el(p,n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t)e.textContent=t;p.appendChild(e);return e}
function fit(f){const r=S[f].r,X=r.map(x=>x.a),Y=r.map(x=>x.c/x.d),mx=av(X),my=av(Y);let n=0,d=0;X.forEach((x,i)=>{n+=(x-mx)*(Y[i]-my);d+=(x-mx)**2});const b=d?n/d:0;return a=>Math.max(0,my+b*(a-mx))}
const bucket=a=>a<=2?"New (0-2y)":a<=5?"Mid-life (3-5y)":a<=9?"Aged (6-9y)":"Old (10+y)";
const BK=["New (0-2y)","Mid-life (3-5y)","Aged (6-9y)","Old (10+y)"];
const PROS={E85:[["Cheaper at the pump","Lower CO₂ than petrol"],["Lower mileage raises running cost","Few filling stations"],"flex-fuel owners near E85 pumps"],Petrol:[["Widely available","Low maintenance cost"],["Higher CO₂ than CNG/EV","Price-sensitive"],"mixed everyday driving"],Diesel:[["Strong highway mileage","Long range"],["Higher maintenance","High emissions"],"high-km highway users"],CNG:[["Low cost per km","Lower emissions"],["Sparse refuel network","Boot space lost"],"city commuters and fleets"],EV:[["Lowest running cost","Zero tailpipe emissions"],["Slow recharge","Needs charging access"],"home-charging city drivers"]};
function score(){const e=S.E85;if(!e)return 0;const b=k=>Math.min(...F.map(f=>S[f][k]));return 4*b("cost")/e.cost+3*b("co2")/e.co2+2*b("ref")/e.ref+1*b("mnt")/e.mnt}
function render(){const fu=$("fu").value,km=+$("km").value||0,ag=+$("ag").value||0,P=S.Petrol,E=S.E85;
$("hd").textContent=`Kia Seltos · ${fu} · Age:${ag}y · ${km}km/mo · Mixed use`;$("sb").textContent=`Kia Seltos owner view. Fuel averages computed from the CSV (${D.length} records); change fuel, km/month or age to explore.`;
const pen=(E.cost-P.cost)/P.cost*100,sav=(P.price-E.price)/P.price*100,be=E.mil/P.mil*P.price;
const K=[["Cost/km · "+fu,"₹"+fx(S[fu].cost)],["E85 cost/km","₹"+fx(E.cost)],["E85 premium vs Petrol",(pen>0?"+":"")+fx(pen,1)+"%"],["E85 break-even price","₹"+fx(be,1)+"/L"],["Monthly cost · "+fu,"₹"+Math.round(S[fu].cost*km).toLocaleString("en-IN")]];
$("kp").innerHTML=K.map(k=>`<div class="g"><div class="kl">${k[0]}</div><div class="kv">${k[1]}</div></div>`).join("");
const sv=$("bar");sv.innerHTML="";const mx=Math.max(...F.map(f=>S[f].cost));F.forEach((f,i)=>{const h=S[f].cost/mx*170,x=30+i*70,r=el(sv,"rect",{x,y:200-h,width:48,height:h,rx:6,fill:CL[f]});el(sv,"text",{x:x+24,y:218,"text-anchor":"middle"},f);el(sv,"text",{x:x+24,y:194-h,"text-anchor":"middle"},"₹"+fx(S[f].cost));tp(r,`${f}: ₹${fx(S[f].cost)}/km`)});
const dn=$("dn");dn.innerHTML="";const tot=F.reduce((s,f)=>s+S[f].co2,0);let a0=-Math.PI/2;F.forEach((f,i)=>{const a1=a0+S[f].co2/tot*2*Math.PI,c=(a,r)=>[120+r*Math.cos(a),120+r*Math.sin(a)],p1=c(a0,90),p2=c(a1,90),p3=c(a1,52),p4=c(a0,52),l=a1-a0>Math.PI?1:0;const p=el(dn,"path",{d:`M${p1}A90 90 0 ${l} 1 ${p2}L${p3}A52 52 0 ${l} 0 ${p4}Z`,fill:CL[f]});tp(p,`${f}: ${fx(S[f].co2,3)} kg/km`);el(dn,"rect",{x:250,y:70+i*24,width:12,height:12,fill:CL[f]});el(dn,"text",{x:268,y:81+i*24},`${f} ${fx(S[f].co2,3)}`);a0=a1});
const ln=$("ln");ln.innerHTML="";const fts=F.map(f=>[f,fit(f)]),ym=Math.max(...fts.map(([f,g])=>g(12)),...F.map(f=>S[f].cost))*1.1;const X=a=>40+a/12*340,Y=v=>220-v/ym*200;
for(let i=0;i<=12;i+=2)el(ln,"text",{x:X(i),y:238,"text-anchor":"middle"},i+"y");for(let i=0;i<=4;i++)el(ln,"text",{x:34,y:Y(ym*i/4)+4,"text-anchor":"end"},fx(ym*i/4,1));
fts.forEach(([f,g])=>{const pts=[0,3,6,9,12].map(a=>X(a)+","+Y(g(a))).join(" ");const p=el(ln,"polyline",{points:pts,fill:"none",stroke:CL[f],"stroke-width":2.5});tp(p,`${f}: ₹${fx(g(ag))}/km at ${ag}y`)});
el(ln,"line",{x1:X(ag),x2:X(ag),y1:20,y2:220,stroke:"#fff","stroke-dasharray":"4"});el(ln,"text",{x:X(ag),y:14,"text-anchor":"middle"},"Car age "+ag+"y");
let t=`<table><tr><th>Fuel</th>${BK.map(b=>`<th>${b}</th>`).join("")}</tr>`;F.forEach(f=>{t+=`<tr><td style="color:${CL[f]}">${f}</td>`+BK.map(b=>{const r=S[f].r.filter(x=>bucket(x.a)==b);return r.length?`<td>₹${fx(av(r.map(x=>x.c/x.d)))} · ${fx(av(r.map(x=>x.m/x.d)),3)}</td>`:"<td>–</td>"}).join("")+"</tr>"});$("bk").innerHTML=t+`</table><div class="kl" style="margin-top:8px">Selected age bucket: ${bucket(ag)}</div>`;
$("pd").innerHTML=`<p>Pump saving: <b>${fx(sav,1)}%</b> cheaper per litre</p><p>Running penalty: <b>${fx(pen,1)}%</b> per km vs Petrol</p><p>Break-even E85 price: <b>₹${fx(be,1)}/L</b> (current ₹${fx(E.price,1)})</p><p class="kl">${pen>0?"E85 looks cheaper at the pump but costs more per km because of lower mileage.":"E85 is cheaper both at the pump and per km."}</p>`;
const s=score(),ga=$("ga");ga.innerHTML=`<path d="M20 110A80 80 0 0 1 180 110" fill="none" stroke="#ffffff20" stroke-width="16" stroke-linecap="round"/><path class="gauge-arc" d="M20 110A80 80 0 0 1 180 110" fill="none" stroke="#ffb020" stroke-width="16" stroke-linecap="round" pathLength="283" stroke-dasharray="283" style="stroke-dashoffset:${283*(1-s/10)}"/><text x="100" y="105" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#fff">${fx(s,1)}</text><text x="100" y="122" text-anchor="middle">out of 10</text>`;
$("vd").textContent=s>=7?"E85 is a strong all-round choice.":s>=5?"E85 is a decent middle option, held back by running cost.":"E85 lags other fuels on cost, emissions and refuel time.";
$("fc").innerHTML=F.map(f=>{const p=PROS[f];return `<div class="g fc ${f==fu?"on":""}" style="--c:${CL[f]}"><h4>${f}</h4><p>✅ ${p[0][0]}</p><p>✅ ${p[0][1]}</p><p>❌ ${p[1][0]}</p><p>❌ ${p[1][1]}</p><p>🚗 Best for ${p[2]}</p></div>`}).join("")}
$("fu").innerHTML=F.map(f=>`<option ${f=="Petrol"?"selected":""}>${f}</option>`).join("");["fu","km","ag"].forEach(i=>$(i).oninput=render);render();
</script></body></html>
